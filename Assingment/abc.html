<!DOCTYPE html>
<html>
<head>
    <title>Fetch API Table Example</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        button {
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>User Data</h2>

<button onclick="loadData()">Fetch Data</button>

<table id="dataTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>
    </thead>
    <tbody>
        <!-- Data will come here -->
    </tbody>
</table>

<script>
async function loadData() {
    try {
        const response = await fetch("https://697865aecd4fe130e3d8baf1.mockapi.io/het");
        const data = await response.json();

        const tableBody = document.querySelector("#dataTable tbody");
        tableBody.innerHTML = ""; // clear old data

        data.forEach(user => {
            const row = `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

    } catch (error) {
        console.error("Error fetching data:", error);
    }
}

// loadData()
</script>

</body>
</html>
